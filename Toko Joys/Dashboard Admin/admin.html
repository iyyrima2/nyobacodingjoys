<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Admin | Joy’s</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="d-flex align-items-center mb-4">
      <img src="/gambar/logo.png" width="35" class="me-2" alt="logo">
      <h4 class="fw-bold m-0">Joy’s</h4>
    </div>
    <ul class="list-unstyled">
      <li><a href="#" class="active">PRODUK</a></li>
      <li><a href="#">SUPLIER</a></li>
      <li><a href="#">LAPORAN</a></li>
    </ul>
    <div class="mt-auto p-2 mb-1">
      <button id="logout-btn" class="btn btn-info text-white">
        <i class="bi bi-box-arrow-right me-2"></i> LOGOUT
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h4 class="fw-bold">LIST PRODUK</h4>
      <button class="btn btn-info text-white px-4" data-bs-toggle="modal" data-bs-target="#addModal">
        <i class="bi bi-plus-lg me-1"></i> Tambahkan produk
      </button>
    </div>

    <table class="table align-middle text-center shadow-sm">
      <thead class="table-light">
        <tr>
          <th>Foto</th>
          <th>Nama</th>
          <th>Kategori</th>
          <th>Harga</th>
          <th>Banyak</th>
          <th>Tanggal Kadaluwarsa</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody id="productTable"></tbody>
    </table>
  </main>

  <!-- Modal Tambah/Edit Produk -->
  <div class="modal fade" id="addModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="modalTitle">Tambah Produk</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="productForm">
            <input type="hidden" id="editIndex">
            <div class="mb-2">
              <label class="form-label">Nama Produk</label>
              <input type="text" class="form-control" id="nama" required>
            </div>
            <div class="mb-2">
              <label class="form-label">Kategori</label>
              <input type="text" class="form-control" id="kategori" required>
            </div>
            <div class="mb-2">
              <label class="form-label">Harga</label>
              <input type="number" class="form-control" id="harga" required>
            </div>
            <div class="mb-2">
              <label class="form-label">Banyak</label>
              <input type="number" class="form-control" id="banyak" required>
            </div>
            <div class="mb-2">
              <label class="form-label">Tanggal Kadaluwarsa</label>
              <input type="date" class="form-control" id="tanggal" required>
            </div>
            <div class="mb-2">
              <label class="form-label">URL Foto</label>
              <input type="text" class="form-control" id="foto" placeholder="https://..." required>
            </div>
            <button type="submit" class="btn btn-info text-white w-100">Simpan</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Konfirmasi Hapus -->
<div class="modal fade" id="confirmDeleteModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content text-center p-4">
      <div class="fs-1 text-warning"><i class="bi bi-exclamation-octagon"></i></div>
      <h5 class="fw-bold mt-2">Kamu yakin!</h5>
      <p>Kamu ingin menghapus produk ini?</p>
      <div class="d-flex justify-content-center gap-2">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
        <button id="confirmDeleteBtn" class="btn btn-danger">Hapus</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal Berhasil Tambah Produk -->
<div class="modal fade" id="successModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content text-center p-4">
      <div class="fs-1 text-success"><i class="bi bi-check-circle"></i></div>
      <h5 class="fw-bold mt-2">Berhasil menambahkan Produk</h5>
      <button class="btn btn-info text-white mt-3 px-4" data-bs-dismiss="modal">Kembali</button>
    </div>
  </div>
</div>

  <!-- Bootstrap JS & Script -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="admin.js"></script>
</body>
</html>
