<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Joy’s</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="Login.css">

</head>
<body>

  <div class="container-fluid vh-100 d-flex align-items-center justify-content-center bg-light">
    <div class="row shadow rounded-4 bg-white overflow-hidden w-80">
      <div class="col-md-6 p-5">
        <div class="d-flex align-items-center mb-4">
          <img src="/gambar/logo.png" alt="logo" width="35" class="me-2">
          <h4 class="fw-bold m-0">Joy’s</h4>
        </div>

        <h3 class="mb-3 fw-bold">Login</h3>
        <p class="text-muted mb-4">Login untuk mengakses akun Anda</p>

        <form>
          <div class="mb-3">
            <label class="form-label mb-1">Email</label>
            <input type="email" class="form-control" placeholder="Masukkan email Anda" required>
          </div>

          <div class="mb-3 position-relative">
            <label class="form-label">Password</label>
            <input type="password" id="password" class="form-control" placeholder="Masukkan password" required>
            <span class="toggle-password" style="cursor:pointer;">
              <i class="bi bi-eye"></i>
            </span>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="remember">
              <label class="form-check-label" for="remember">Ingat saya</label>
            </div>
            <a href="../ForgotPassword/Forgot.html" class="text-danger small no-underline">Lupa Password</a>
          </div>

          <button type="submit" class="btn btn-info text-white w-100 mb-3"> <b>Login</b></button>

          <p class="text-center mb-2">Belum punya akun? 
            <a href="../SignUp/signup.html" class="text-danger fw-bold no-underline">Sign up</a>
          </p>

          <div class="text-center text-muted mb-3">Atau login dengan</div>

          <div class="d-flex justify-content-center gap-3">
            <button type="button" class="btn btn-outline-primary social-btn">
              <i class="bi bi-facebook"></i>
            </button>

            <button type="button" class="btn btn-outline-danger social-btn">
              <img src="/gambar/google.png" alt="Google Logo" class="social-icon">
            </button>

            <button type="button" class="btn btn-outline-dark social-btn">
              <i class="bi bi-apple"></i>
            </button>
          </div>
        </form>
      </div>

      <div class="col-md-6 d-flex align-items-center justify-content-center">
        <img src="/gambar/login.png" alt="login illustration" class="img-fluid w-90">
      </div>

    </div>
  </div>

  <!-- Script -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="Login.js"></script>
</body>
</html>
