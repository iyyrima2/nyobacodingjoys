<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atur Kata Sandi | Joy’s</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="reset.css">
</head>
<body>

  <div class="container-fluid vh-100 d-flex align-items-center justify-content-center bg-light">
    <div class="row shadow rounded-4 bg-white overflow-hidden w-80" style="max-width: 1000px;">

      <!-- Kolom kiri -->
      <div class="col-md-6 p-5 d-flex flex-column justify-content-center">
        <div class="d-flex align-items-center mb-5">
          <img src="/gambar/logo.png" alt="logo" width="35" class="me-2">
          <h4 class="fw-bold m-0">Joy’s</h4>
        </div>

        <h3 class="fw-bold mb-3">Atur kata sandi</h3>
        <p class="text-muted mb-4">
          Kata sandi Anda sebelumnya telah direset. Silakan atur kata sandi baru untuk akun Anda.
        </p>

        <form id="resetForm">
          <!-- Password baru -->
          <div class="mb-3 position-relative">
            <label class="form-label small text-muted mb-1">Buat Password</label>
            <div class="input-group">
              <input type="password" id="newPassword" class="form-control" placeholder="Masukkan password baru" required>
              <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('newPassword', this)">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <!-- Konfirmasi Password -->
          <div class="mb-4 position-relative">
            <label class="form-label small text-muted mb-1">Masukkan ulang Password</label>
            <div class="input-group">
              <input type="password" id="confirmPassword" class="form-control" placeholder="Ulangi password baru" required>
              <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('confirmPassword', this)">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <!-- Tombol simpan -->
          <button type="submit" class="btn btn-info text-white w-100"><b>Simpan kata sandi</b></button>
        </form>
      </div>

      <!-- Kolom kanan -->
      <div class="col-md-6 d-flex align-items-center justify-content-center p-4">
        <img src="/gambar/forgot.png" alt="illustration" class="img-fluid rounded-3" style="max-height: 480px;">
      </div>
    </div>
  </div>

  <script src="reset.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
