<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up | Joy’s</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="signup.css">
</head>
<body>

  <div class="container-fluid vh-100 d-flex align-items-center justify-content-center bg-light">
    <div class="row shadow rounded-4 bg-white overflow-hidden w-80" style="max-width: 1100px;">
      
      <!-- Gambar sebelah kiri -->
      <div class="col-md-6 d-flex align-items-center justify-content-center p-4">
        <img src="/gambar/signup.png" alt="sign up illustration" class="img-fluid rounded-3" style="max-height: 550px;">
      </div>

      <!-- Form Sign Up -->
      <div class="col-md-6 p-5">
        <div class="d-flex align-items-center mb-4">
          <img src="/gambar/logo.png" alt="logo" width="35" class="me-2">
          <h4 class="fw-bold m-0">Joy’s</h4>
        </div>

        <h3 class="fw-bold mb-2">Sign up</h3>
        <p class="text-muted mb-4">Mari kita bantu agar dapat mengakses akun pribadi Anda.</p>

        <form>
          <div class="row mb-3">
            <div class="col">
              <input type="text" class="form-control" placeholder="Nama Depan" required>
            </div>
            <div class="col">
              <input type="text" class="form-control" placeholder="Nama Belakang" required>
            </div>
          </div>

          <div class="row mb-3">
            <div class="col">
              <input type="email" class="form-control" placeholder="Email" required>
            </div>
            <div class="col">
              <select class="form-select" required>
                <option value="" disabled selected>Pilih Posisi</option>
                <option value="owner">Owner</option>
                <option value="admin">Admin</option>
                <option value="kasir">Kasir</option>
              </select>
            </div>
          </div>

          <div class="mb-3 position-relative">
            <input type="password" id="password" class="form-control" placeholder="Password" required>
            <span class="toggle-password" style="cursor:pointer;">
              <i class="bi bi-eye"></i>
            </span>
          </div>

          <div class="mb-3 position-relative">
            <input type="password" id="confirm-password" class="form-control" placeholder="Konfirmasi Password" required>
            <span class="toggle-password2" style="cursor:pointer;">
              <i class="bi bi-eye"></i>
            </span>
          </div>

          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" id="agree" required>
            <label class="form-check-label" for="agree">
              Saya menyetujui semua <a href="#" class="text-danger">Syarat</a> dan <a href="#" class="text-danger">Kebijakan Privasi</a> yang berlaku
            </label>
          </div>

          <button type="submit" class="btn btn-info text-white w-100 mb-3"><b>Buat akun</b></button>

          <p class="text-center mb-2">Sudah punya akun? 
            <a href="../Login/login.html" class="text-danger fw-bold no-underline">Login</a>
          </p>

          <div class="text-center text-muted mb-3">Atau Sign up dengan</div>

          <div class="d-flex justify-content-center gap-3">
            <button type="button" class="btn btn-outline-primary social-btn">
              <i class="bi bi-facebook"></i>
            </button>

            <button type="button" class="btn btn-outline-danger social-btn">
              <img src="/gambar/google.png" alt="Google Logo" class="social-icon">
            </button>

            <button type="button" class="btn btn-outline-dark social-btn">
              <i class="bi bi-apple"></i>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="signup.js"></script>
</body>
</html>
