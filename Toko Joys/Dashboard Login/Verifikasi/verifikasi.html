<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password (Verify Code) | Joy’s</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="verifikasi.css">
</head>
<body>

  <div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center bg-light">
    <div class="card shadow border-0 rounded-4 overflow-hidden d-flex flex-md-row flex-column" style="max-width: 900px;">
      
      <!-- Kolom kiri -->
      <div class="col-md-6 p-5 d-flex flex-column justify-content-center">
        <div class="d-flex align-items-center mb-4">
          <img src="/gambar/logo.png" alt="logo" width="35" class="me-2">
          <h4 class="fw-bold m-0 text-dark">Joy’s</h4>
        </div>

        <a href="../Login/Login.html" class="text-secondary small text-decoration-none mb-3 d-inline-flex align-items-center">
          <i class="bi bi-arrow-left me-2"></i> Kembali ke login
        </a>

        <h3 class="fw-bold mb-3 text-capitalize">Verifikasi kode</h3>
        <p class="text-muted mb-4">Kode verifikasi telah dikirim ke email Anda.</p>

        <form id="verifyForm">
          <div class="mb-4 position-relative">
            <label class="form-label small text-muted mb-1">Isi Kode</label>
            <input type="password" id="kode" class="form-control pe-5" placeholder="Masukkan kode verifikasi" required>
            <i class="bi bi-eye toggle-view"></i>
          </div>

          <p class="text-muted mb-4">
            Belum menerima kode? 
            <a href="#" class="text-danger fw-bold text-decoration-none">Kirim ulang</a>
          </p>

          <button type="submit" class="btn btn-info text-white w-100 py-2 fw-bold">Verifikasi</button>
        </form>
      </div>

      <!-- Kolom kanan -->
      <div class="col-md-6 bg-light d-flex align-items-center justify-content-center p-4">
        <img src="/gambar/login.png" alt="verify illustration" class="img-fluid rounded-3" style="max-height: 450px;">
      </div>
    </div>
  </div>

  <script src="verifikasi.js"></script>
</body>
</html>
