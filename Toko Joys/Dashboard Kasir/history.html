<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riwayat Transaksi | Joy’s</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container-fluid p-4">

  <!-- Header -->
  <div class="d-flex align-items-center justify-content-between border rounded-4 p-3 mb-3 shadow-sm">
    <div class="d-flex align-items-center">
      <i class="bi bi-shop fs-3 me-2 text-info"></i>
      <h3 class="fw-bold m-0">Joy’s</h3>
    </div>

    <div class="search-box d-flex align-items-center">
      <input type="text" class="form-control search-field rounded-pill px-4" placeholder="Search">
    </div>
  </div>

  <div class="row">

    <!-- LEFT LIST -->
    <div class="col-md-7 pe-3 scroll-area">

      <!-- Tanggal -->
      <h6 class="text-center text-muted mb-3 mt-3">30 Oktober 2025</h6>

      <!-- Card Item -->
      <div class="history-card active d-flex justify-content-between align-items-center p-3 rounded-4 shadow-sm mb-3">
        <div>
          <h6 class="fw-bold text-info">3 Items</h6>
          <span class="text-muted">Rp. 35.000</span>
        </div>
        <button class="btn btn-sm btn-danger rounded-circle">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>

      <h6 class="text-center text-muted mb-3 mt-4">29 Oktober 2025</h6>

      <!-- Card Non Active -->
      <div class="history-card d-flex justify-content-between align-items-center p-3 rounded-4 shadow-sm mb-3">
        <div>
          <h6 class="fw-bold text-info">3 Items</h6>
          <span class="text-muted">Rp. 36.000</span>
        </div>
        <button class="btn btn-sm btn-danger rounded-circle">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>

      <!-- Tambah card lain sesuai kebutuhan -->

    </div>

    <!-- RIGHT DETAIL -->
    <div class="col-md-5 ps-3">

      <div class="detail-box border rounded-4 p-4 shadow-sm">

        <h6 class="fw-bold mb-1">30 Oktober 2025</h6>
        <span class="text-muted">Fidia Adella</span>

        <hr>

        <div class="d-flex justify-content-between mb-2">
          <span>x1 Beras</span>
          <span>Rp. 10.000</span>
        </div>

        <div class="d-flex justify-content-between mb-2">
          <span>x1 Garam</span>
          <span>Rp. 12.000</span>
        </div>

        <div class="d-flex justify-content-between mb-3">
          <span>x1 Tepung Tapioka</span>
          <span>Rp. 13.000</span>
        </div>

        <hr>

        <div class="d-flex justify-content-between fw-bold">
          <span>Total</span><span>Rp. 35.000</span>
        </div>

        <div class="d-flex justify-content-between mt-2">
          <span>Cash</span><span>Rp. 50.000</span>
        </div>

        <div class="d-flex justify-content-between mt-2 mb-4">
          <span>Kembalian</span><span>Rp. 15.000</span>
        </div>

      </div>

      <!-- Button Cash -->
      <div class="cash-box d-flex justify-content-between align-items-center mt-4 p-4 rounded-4 shadow-sm">
        <div>
          <h6 class="m-0 text-white">3 items</h6>
          <span class="text-light">Rp. 35.000</span>
        </div>
        <button class="btn btn-light px-4 fw-bold">Cash</button>
      </div>

    </div>

  </div>

</div>

<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
