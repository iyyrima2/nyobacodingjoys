<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owner | Joy’s</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="owner.css">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="d-flex align-items-center mb-4">
      <img src="/gambar/logo.png" width="35" class="me-2" alt="logo">
      <h4 class="fw-bold m-0">Joy’s</h4>
    </div>
    <ul class="list-unstyled">
      <li><a href="#" class="active">PENJUALAN</a></li>
      <li><a href="#">PEMBELIAN</a></li>
      <li><a href="#">LABA RUGI</a></li>
      <li><a href="#">ARUS KEUANGAN</a></li>
    </ul>
  </aside>

  <!-- Main Content -->
  <main class="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h4 class="fw-bold">PENJUALAN</h4>
      <div class="input-group w-25">
        <input type="text" class="form-control" placeholder="Search">
        <button class="btn btn-outline-secondary"><i class="bi bi-search"></i></button>
      </div>
    </div>

    <!-- Ringkasan Penjualan -->
    <div class="summary-section mb-4">
      <h6 class="fw-bold mb-3">RINGKASAN PENJUALAN</h6>
      <div class="row g-3">
        <div class="col-md-3">
          <div class="summary-card">
            <p class="mb-1 text-muted small">Penjualan Terbanyak</p>
            <h6 class="fw-bold">29 Oktober 2025</h6>
          </div>
        </div>
        <div class="col-md-3">
          <div class="summary-card">
            <p class="mb-1 text-muted small">Pendapatan Tertinggi</p>
            <h6 class="fw-bold">Rp 350.000</h6>
          </div>
        </div>
        <div class="col-md-3">
          <div class="summary-card">
            <p class="mb-1 text-muted small">Penjualan Terendah</p>
            <h6 class="fw-bold">2 November 2025</h6>
          </div>
        </div>
        <div class="col-md-3">
          <div class="summary-card">
            <p class="mb-1 text-muted small">Pendapatan Terendah</p>
            <h6 class="fw-bold">Rp 30.000</h6>
          </div>
        </div>
      </div>
    </div>

    <!-- Grafik Penjualan -->
    <div class="chart-section">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h6 class="fw-bold">GRAFIK PENJUALAN</h6>
        <div>
          <button class="btn btn-outline-info btn-sm active">Hari</button>
          <button class="btn btn-outline-info btn-sm">Minggu</button>
          <button class="btn btn-outline-info btn-sm">Bulan</button>
          <button class="btn btn-outline-info btn-sm">Tahun</button>
        </div>
      </div>
      <canvas id="salesChart"></canvas>
    </div>
  </main>

  <!-- Script -->
  <script src="owner.js"></script>
</body>
</html>
